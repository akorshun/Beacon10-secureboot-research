name: Explore sectools CLI (arm64)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sectools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcrypt1 2>&1 | tail -1
          sudo ln -sf /lib/aarch64-linux-gnu/libcrypt.so.1.1.0 /lib/aarch64-linux-gnu/libcrypt.so.2
          chmod +x sectools/sectools
      - name: secure-image help
        run: |
          ./sectools/sectools secure-image --help 2>&1 | head -120 || true
      - name: secure-image signing-mode TEST help (minimal)
        run: |
          ./sectools/sectools secure-image --help 2>&1 > si_help.txt || true
          grep -iE "mode|test|profile|format|sw|image-id|sign|signing" si_help.txt | head -60 || true
      - name: try minimal TEST-mode signature of a dummy payload
        run: |
          python3 -c "open('dummy.bin','wb').write(b'A'*65536)"
          ./sectools/sectools secure-image --image dummy.bin --output dummy_signed.mbn \
            --signing-mode TEST 2>&1 | head -40 || true
          ls -la dummy_signed.mbn 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: sectools-explore
          path: |
            si_help.txt
            dummy*
      - run: echo done
