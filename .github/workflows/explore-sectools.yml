name: Sign OpenWrt container
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcrypt1 2>&1 | tail -1
          sudo ln -sf /lib/aarch64-linux-gnu/libcrypt.so.1.1.0 /lib/aarch64-linux-gnu/libcrypt.so.2
          chmod +x sectools/sectools
          ls -la openwrt_unsigned_bootipq.bin
      - name: Sign OpenWrt bootipq container
        run: |
          ./sectools/sectools secure-image openwrt_unsigned_bootipq.bin --sign --signing-mode TEST \
            --security-profile sectools/kodiak_security_profile.xml \
            --image-id ABL \
            --outfile openwrt_final_signed.bin 2>&1 | tail -25 || true
          ls -la openwrt_final_signed.bin 2>/dev/null || true
          python3 -c "
import struct
d = open('openwrt_final_signed.bin','rb').read()
print('size:', len(d))
e_phoff = struct.unpack('<I', d[0x1c:0x20])[0]
e_phnum = struct.unpack('<H', d[0x2c:0x2e])[0]
for i in range(e_phnum):
    ph = d[e_phoff+i*e_phentsize:e_phoff+(i+1)*e_phentsize]
    p_type, p_offset, p_vaddr, p_filesz = struct.unpack('<4I', ph[:16])
    print('  ph%d type=%d off=%#x vaddr=%#x filesz=%#x' % (i, p_type, p_offset, p_vaddr, p_filesz))
" || true
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-final-signed
          path: openwrt_final_signed.bin
      - run: echo done
