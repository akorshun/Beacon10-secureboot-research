name: Explore sectools signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sectools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcrypt1 2>&1 | tail -1
          sudo ln -sf /lib/aarch64-linux-gnu/libcrypt.so.1.1.0 /lib/aarch64-linux-gnu/libcrypt.so.2
          chmod +x sectools/sectools
      - name: list ABL-capable image ids and formats
        run: |
          echo "=== image ids (kodiak) ==="
          ./sectools/sectools secure-image dummy.bin --available-image-ids \
            --security-profile sectools/kodiak_security_profile.xml 2>&1 | head -40 || true
          echo "=== signature formats (kodiak) ==="
          ./sectools/sectools secure-image dummy.bin --available-signature-formats \
            --security-profile sectools/kodiak_security_profile.xml 2>&1 | head -20 || true
      - name: TEST-sign the stock 0:HLOS with ABL image id (kodiak)
        run: |
          python3 -c "open('stock_hlos.bin','wb').write(open('stock-p24.bin','rb').read())" 2>/dev/null || \
            curl -sL "https://raw.githubusercontent.com/akorshun/Beacon10-secureboot-research/main/stock-p24.bin" -o stock_hlos.bin 2>/dev/null || true
          ls -la stock_hlos.bin 2>/dev/null || true
          ./sectools/sectools secure-image stock_hlos.bin --sign --signing-mode TEST \
            --security-profile sectools/kodiak_security_profile.xml \
            --image-id ABL \
            --outfile stock_resigned.mbn 2>&1 | tail -30 || true
          ls -la stock_resigned.mbn 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: sign-tests
          path: |
            stock_resigned.mbn
            stock_hlos.bin
      - run: echo done
