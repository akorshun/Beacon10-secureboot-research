name: Build sec engine harness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          musl-gcc -O1 -o harness vtysh_re/harness.c -ldl
          file harness
          ls -la harness
      - name: Add musl loader
        run: |
          sudo dpkg -L musl | grep -E 'ld-musl|libc.so' | head
          LOADER=$(sudo find / -name 'ld-musl-aarch64.so.1' 2>/dev/null | head -1)
          echo loader: $LOADER
          cp $LOADER ./ld-musl-aarch64.so.1
      - uses: actions/upload-artifact@v4
        with:
          name: harness
          path: |
            harness
            ld-musl-aarch64.so.1
