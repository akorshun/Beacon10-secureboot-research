name: Build sec engine harness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          musl-gcc -O1 -o harness vtysh_re/harness.c -ldl
          file harness
          ls -la harness
      - name: Add musl loader
        run: cp /lib/ld-musl-aarch64.so.1 . 2>/dev/null || cp /lib/libc.musl-aarch64-linux-gnu.so.1 ld-musl-aarch64.so.1 2>/dev/null || true; ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: harness
          path: |
            harness
            ld-musl-aarch64.so.1
