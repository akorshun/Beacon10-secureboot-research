name: Crack ONTUSER hash (passlib)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crack:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update -qq
          pip install passlib
          wget -q https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt -O rockyou.txt
          wc -l rockyou.txt
      - name: Crack
        run: |
          python3 - <<'EOF'
          import multiprocessing as mp
          from passlib.hash import sha256_crypt
          HASH = '$5$oKDRv2eE/FvWfbYb$KUZMFQhW5OmeG.Cd5FqBTCOaxo0MLmkYxw.eecp0RC9'
          SALT = 'oKDRv2eE/FvWfbYb'
          ctx = sha256_crypt.using(salt=SALT, rounds=5000)
          def check(chunk):
              for w in chunk:
                  if ctx.hash(w) == HASH:
                      return w
              return None
          if __name__ == '__main__':
              words = open('rockyou.txt', 'rb').read().decode('latin1').splitlines()
              n = mp.cpu_count()
              chunks = [words[i::n] for i in range(n)]
              print('words:', len(words), 'procs:', n, flush=True)
              with mp.Pool(n) as pool:
                  for res in pool.imap_unordered(check, chunks):
                      if res:
                          print('CRACKED:', res, flush=True)
                          pool.terminate()
                          break
              print('done', flush=True)
          EOF
