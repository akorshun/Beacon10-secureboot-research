name: Build static init tools
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          musl-gcc -Os -static -s -o myinsmod vtysh_re/myinsmod.c
          file myinsmod
          ls -la myinsmod
      - uses: actions/upload-artifact@v4
        with:
          name: myinsmod
          path: myinsmod
